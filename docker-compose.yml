services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - creator_documents:/app/private/creator-verification
      - campaign_evidence:/app/private/campaign-evidence
    environment:
      - MONGO_URI=mongodb://mongodb:27017/trustchain?replicaSet=rs0
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  creator_documents:
  campaign_evidence: